<path id="hero-road-center" class="hero-ribbon" d="M145 420C65 410 60 320 135 300L170 288C230 270 190 215 155 190C95 145 125 70 210 74C275 77 285 133 340 135C390 138 440 90 483 135C540 195 495 244 445 251C362 259 390 347 340 397C290 448 225 435 145 420Z"/>
<path class="hero-ribbon-dashes" d="M145 420C65 410 60 320 135 300L170 288C230 270 190 215 155 190C95 145 125 70 210 74C275 77 285 133 340 135C390 138 440 90 483 135C540 195 495 244 445 251C362 259 390 347 340 397C290 448 225 435 145 420Z"/>
<path id="hero-route-base" d="M145 420C65 410 60 320 135 300L170 288C230 270 190 215 155 190C95 145 125 70 210 74C275 77 285 133 340 135C390 138 440 90 483 135C540 195 495 244 445 251C362 259 390 347 340 397C290 448 225 435 145 420Z"/><path id="hero-route-progress" d="M145 420C65 410 60 320 135 300L170 288C230 270 190 215 155 190C95 145 125 70 210 74C275 77 285 133 340 135C390 138 440 90 483 135C540 195 495 244 445 251C362 259 390 347 340 397C290 448 225 435 145 420Z"/>
