<g class="hero-road-sign hero-sign-speed" transform="translate(518 305)"><ellipse class="hero-sign-shadow" cx="9" cy="44" rx="17" ry="5"/><path class="hero-sign-post" d="M0 14V43"/><circle class="hero-sign-speed-edge" r="22"/><circle class="hero-sign-speed-face" r="17"/><text y="7">40</text></g>
<g class="hero-road-sign hero-sign-curve" transform="translate(383 71)"><ellipse class="hero-sign-shadow" cx="9" cy="48" rx="17" ry="5"/><path class="hero-sign-post" d="M0 13V47"/><rect class="hero-sign-curve-edge" x="-18" y="-18" width="36" height="36" rx="3" transform="rotate(45)"/><rect class="hero-sign-curve-face" x="-15" y="-15" width="30" height="30" rx="2" transform="rotate(45)"/><path class="hero-sign-curve-arrow" d="M-5 12V-2Q-5-7 1-7H8M3-13L9-7L3-1"/></g>
