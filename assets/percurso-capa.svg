<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><style>.hero-blocks path{fill:#171c18;stroke:#171918;stroke-width:.8;stroke-linejoin:round}
.hero-road-outline path{fill:none;stroke:#191b1a;stroke-width:24;stroke-linejoin:round;stroke-linecap:round}.hero-roads path{fill:none;stroke:#252b27;stroke-width:21;stroke-linejoin:round;stroke-linecap:round}
.hero-lane-lines path{fill:none;stroke:#81897c;stroke-width:.55;stroke-dasharray:5 7;opacity:.32}
.hero-yard{fill:#1d2820;stroke:#2a3029;stroke-width:.8}.hero-yard-building{fill:#2c352d;stroke:#2d332a;stroke-width:.5}
#hero-route-base{fill:none;stroke:#79651a;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
#hero-route-progress{fill:none;stroke:#ffce26;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;}
.hero-map-labels text{font-family:Arial,sans-serif;fill:#929a89;font-size:8px;letter-spacing:.1px;paint-order:stroke;stroke:#101211;stroke-width:2.5px;stroke-linejoin:round}
.hero-patio-pin{fill:#19241c;stroke:#464e40;stroke-width:.65}.hero-patio-pin text{fill:#b2bd9f;stroke:none;font:bold 6px Arial,sans-serif;letter-spacing:1.5px}
.hero-parked rect{fill:#71796a;stroke:#b7c0ae;stroke-width:.5}.hero-parked path{stroke:#303b31;stroke-width:1.4}
.hero-stop-pin path{fill:#59342c;stroke:#a1644d;stroke-width:.6}.hero-stop-pin text{fill:#dcab91;text-anchor:middle;font:bold 4px Arial,sans-serif}
.hero-destination circle:first-child{fill:#262313;stroke:#8f761c;stroke-width:.7}.hero-destination circle:last-child{fill:#ffce26}
.hero-car-aura{fill:#191912;stroke:#322d14;stroke-width:.6}
.hero-car-left,.hero-car-right{fill:#ffc129;opacity:0}.hero-preview[data-playing=true] #hero-car[data-signal=left] .hero-car-left,.hero-preview[data-playing=true] #hero-car[data-signal=right] .hero-car-right{opacity:1;animation:hero-signal .85s steps(2,end) infinite}
.hero-preview[data-playing=false] #hero-car[data-signal=left] .hero-car-left,.hero-preview[data-playing=false] #hero-car[data-signal=right] .hero-car-right{opacity:1}
#hero-car[data-under-roof=true]{opacity:.3}
.hero-canopy path:first-child{fill:#3d4d43;stroke:#768e7a;stroke-width:.7}.hero-canopy path:last-child{fill:none;stroke:#454e45;stroke-width:.7}
/* Estrada da capa: ilustração livre, com placas e paisagismo. */
.hero-preview:before{inset:13% -2% 3%;border-color:#151716;transform:rotate(-18deg)}
.hero-map-stage{aspect-ratio:600 / 480;mask-image:none}
.hero-park{fill:#20291c;stroke:#1d211a;stroke-width:1.2}
.hero-park-ring{fill:none;stroke:#21231c;stroke-width:2;stroke-linecap:round;stroke-dasharray:2 7}
.hero-trees circle:nth-child(-n+3){fill:#101c13;stroke:#20281f;stroke-width:1;}
.hero-trees circle:nth-child(n+4){fill:#34432a;stroke:#293023;stroke-width:.7}
.hero-scenic-dots{fill:#404027}
.hero-road-shadow{fill:none;stroke:#0b0c0b;stroke-width:59;transform:translate(5px,9px);stroke-linejoin:round}
.hero-ribbon-curb{fill:none;stroke:#444c3b;stroke-width:52;stroke-linejoin:round}
.hero-ribbon{fill:none;stroke:#272d28;stroke-width:47;stroke-linejoin:round}
.hero-ribbon-dashes{fill:none;stroke:#676b5e;stroke-width:1.15;stroke-dasharray:7 10;stroke-linecap:round}
.hero-road-art #hero-route-base{stroke:#5a4c18;stroke-width:2}.hero-road-art #hero-route-progress{stroke:#ffce26;stroke-width:2.3;}
.hero-crosswalk path{stroke:#c3c8af;stroke-width:4;opacity:.6}
.hero-stop-line{fill:none;stroke:#e2e1ca;stroke-width:2.4;stroke-linecap:round}
.hero-sign-shadow{fill:#0c0d0c}.hero-sign-post{fill:none;stroke:#839284;stroke-width:3;stroke-linecap:round}
.hero-road-sign{}
.hero-sign-stop-edge{fill:#efe5d4;stroke:#404141;stroke-width:.8}.hero-sign-stop-face{fill:#ba5540}.hero-sign-stop text{fill:#fff6e9;font:800 10px Arial,sans-serif;text-anchor:middle;letter-spacing:.7px}
.hero-sign-speed-edge{fill:#bd5640;stroke:#5c5a53;stroke-width:.7}.hero-sign-speed-face{fill:#f3e9d6}.hero-sign-speed text{fill:#282b25;text-anchor:middle;font:800 21px Arial,sans-serif;letter-spacing:-1px}
.hero-sign-curve-edge{fill:#20251a;stroke:#605124;stroke-width:.7}.hero-sign-curve-face{fill:#ffce36}.hero-sign-curve-arrow{fill:none;stroke:#2b2d1c;stroke-width:4;stroke-linecap:square;stroke-linejoin:round}
.hero-cones ellipse{fill:#0c0d0c}.hero-cones path:nth-child(2){fill:#cc8c33;stroke:#605841;stroke-width:.6}.hero-cones path:last-child{fill:none;stroke:#eee3c2;stroke-width:3}
.hero-cue{width:199px;min-height:51px;transition:opacity .15s,visibility .15s}
.hero-cue[data-visible=false]{opacity:0;visibility:hidden}.hero-cue[data-visible=true]{opacity:1;visibility:visible}
.hero-cue[data-kind=stop]{border-color:#603e2f}.hero-cue[data-kind=stop] .hero-cue-arrow{background:#bd5943;color:#fff5e6;font-size:.53rem;letter-spacing:.01em}.hero-cue[data-kind=stop] strong{color:#f5d4bc}
.hero-preview-caption{padding-top:13px;border-top:1px solid #1a1c1b}.hero-preview-caption>.hero-art-motto{font-size:.48rem;letter-spacing:.14em;color:#c6b76e;font-weight:650}
@media(max-width:640px){.hero-map-stage{aspect-ratio:600 / 480}.hero-cue{width:180px;min-height:47px}.hero-preview-caption{margin-inline:6px;padding-inline:0}.hero-preview-caption>.hero-art-motto{font-size:.43rem;letter-spacing:.11em}.hero-preview{margin-top:32px}}
@media(prefers-reduced-motion:reduce){.hero-cue{transition:none}}
</style><rect width="1200" height="630" fill="#101211"/><path d="M0 612Q600 558 1200 605V630H0Z" fill="#ffce26"/><g font-family="DejaVu Sans,Arial,sans-serif"><path d="M64 104H96" stroke="#ffce26" stroke-width="3"/><text x="108" y="108" fill="#e7ce76" font-size="11" letter-spacing="2">SEU TREINO COMEÇA AQUI</text><text x="60" y="243" fill="#fff" font-weight="900" font-size="66" letter-spacing="-3">EXAME DE</text><text x="60" y="324" fill="#ffce26" font-weight="900" font-size="84" font-style="italic" letter-spacing="-4">DIREÇÃO</text><text x="65" y="373" fill="#b7beb2" font-size="18">Treine para seu exame prático de direção</text><path d="M65 407V445" stroke="#ffce26" stroke-width="3"/><text x="80" y="434" fill="#ffce26" font-size="25" font-weight="800">Sorocaba/SP</text><text x="65" y="520" fill="#b7beb2" font-size="13">PÁTIO + PERCURSO ILUSTRATIVO</text></g><svg x="640" y="48" width="520" height="500" id="hero-map" class="hero-map hero-road-art" viewBox="0 0 600 500" role="img" aria-label="Ilustração animada de uma estrada com curvas suaves, carrinho e placas de trânsito. Cenário decorativo da capa.">
<defs><radialGradient id="hero-map-light"><stop stop-color="#1f1e12"/><stop offset="1" stop-color="#101211"/></radialGradient><pattern id="hero-map-grid" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".5" fill="#1b1d1c"/></pattern><linearGradient id="hero-car-paint" x2="1" y2="1"><stop stop-color="#fff0a4"/><stop offset=".5" stop-color="#ffcc15"/><stop offset="1" stop-color="#d39908"/></linearGradient></defs>
<ellipse cx="300" cy="252" rx="250" ry="205" fill="url(#hero-map-light)"/>
<g class="hero-scenery"><path class="hero-park" d="M230 173Q290 194 336 183Q387 179 370 233Q333 277 340 323Q330 383 274 383Q217 373 224 324Q252 271 215 231Q187 191 230 173Z"/><path class="hero-park-ring" d="M250 202Q295 222 333 207M250 348Q282 363 313 342"/>
<g class="hero-trees"><circle cx="275" cy="247" r="22"/><circle cx="299" cy="264" r="17"/><circle cx="267" cy="280" r="18"/><circle cx="275" cy="245" r="15"/><circle cx="299" cy="261" r="11"/><circle cx="267" cy="278" r="12"/></g>
<g class="hero-scenic-dots"><circle cx="62" cy="161" r="3"/><circle cx="78" cy="149" r="2"/><circle cx="517" cy="395" r="3"/><circle cx="529" cy="385" r="2"/><circle cx="367" cy="454" r="2"/></g></g>
