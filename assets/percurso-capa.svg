<g id="hero-car" transform="translate(340 144) rotate(90) scale(.85)" data-signal="left" data-under-roof="false"><circle class="hero-car-aura" r="24"/><g><rect x="-9" y="-18" width="18" height="36" rx="5" fill="url(#hero-car-paint)" stroke="#ffe685" stroke-width=".8"/><path d="M-6 -10H6L5 -3H-5Z M-5 9H5L5 13H-5Z" fill="#27302e"/><path d="M-8-2V7M8-2V7" stroke="#bb8b08"/><path d="M-6-16H-3M3-16H6" stroke="#fff8d7" stroke-width="2" stroke-linecap="round"/><path d="M-6 16H-3M3 16H6" stroke="#b05634" stroke-width="1.5"/><g class="hero-car-left"><circle cx="-10" cy="-12" r="2.3"/><circle cx="-10" cy="12" r="2.3"/></g><g class="hero-car-right"><circle cx="10" cy="-12" r="2.3"/><circle cx="10" cy="12" r="2.3"/></g></g></g>

